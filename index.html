<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />
    <link rel="stylesheet" href="./style.css" />

    <style>
      @import url("https://fonts.googleapis.com/css2?family=Sora&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@600&display=swap");
      @import url("https://fonts.googleapis.com/css2?family=Sora:wght@700&display=swap");
    </style>

    <title>Frontend Mentor | Typing Speed Test</title>
  </head>
  <body>
    <header>
      <picture>
        <source
          media="(min-width:1440px)"
          srcset="./assets/images/logo-large.svg"
        />
        <source
          media="(min-width:320px)"
          srcset="./assets/images/logo-small.svg"
        />
        <img src="./assets/images/logo-small.svg" alt="logo-small" />
      </picture>

      <div class="personal-best-score">
        <img
          src="./assets/images/icon-personal-best.svg"
          alt="icon-personal-best"
        />
        <p class="personal-best sora-regular" id="personal-best">Best:</p>
        <p class="personal-best-score sora-regular" id="personal-best-score">
          92 WPM
        </p>
      </div>
    </header>

    <main>
      <section>
        <div class="wpm-accuracy-time">
          <p class="wpm sora-regular">
            WPM: <span id="wpm" class="sora-bold">0</span>
          </p>
          <p class="accuracy sora-regular">
            Accuracy: <span id="accuracy" class="sora-bold">100%</span>
          </p>
          <p class="time sora-regular">
            Time: <span id="time" class="sora-bold">0:60</span>
          </p>
        </div>

        <div class="drop-down-menus">
          <select
            name="difficulty"
            id="difficulty-mobile"
            class="difficulty-mobile sora-regular"
          >
            <option value="easy">Easy</option>
            <option value="medium">Medium</option>
            <option value="hard">Hard</option>
          </select>

          <form
            name="difficulty"
            id="difficulty-desktop"
            class="difficulty-desktop"
          >
            <label>Difficulty: </label>
            <input type="button" value="Easy" />
            <input type="button" value="Medium" />
            <input type="button" value="Hard" />
          </form>

          <select name="mode" id="mode-mobile" class="mode-mobile sora-regular">
            <option value="timed(60s)">Timed (60s)</option>
            <option value="passage">Passage</option>
          </select>

          <form name="mode" id="mode-desktop" class="mode-desktop">
            <label>Mode: </label>
            <input type="button" value="Timed (60s)" />
            <input type="button" value="Passage" />
          </form>
        </div>
      </section>

      <hr />

      <textarea></textarea>
    </main>

    <footer>
      <p class="sora-regular">
        Challenge by
        <a href="https://www.frontendmentor.io?ref=challenge" class="sora-bold"
          >Frontend Mentor</a
        >
        | Coded by
        <a
          href="https://github.com/grace-sampao"
          target="_blank"
          class="sora-bold"
          >Grace Sampao</a
        >
      </p>
    </footer>
  </body>
</html>
